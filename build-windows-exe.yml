name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow qrcode pywin32

      - name: Build EXE
        shell: cmd
        run: >
          python -m PyInstaller --onefile --windowed
          --name "Diamonds_Student_Point_Billing"
          --add-data "diamond_student_point_logo.png;."
          "Diamonds_Student_Point_Quick_Billing.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Diamonds-Student-Point-Billing-Windows
          path: dist/Diamonds_Student_Point_Billing.exe
