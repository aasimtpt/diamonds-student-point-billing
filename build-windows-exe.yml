name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name "Diamonds_Student_Point_Billing" "Diamonds_Student_Point_Quick_Billing.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Diamonds-Student-Point-Billing-Windows
          path: dist/Diamonds_Student_Point_Billing.exe
