name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow qrcode pywin32 pyinstaller

      - name: Verify dependencies before building
        shell: pwsh
        run: |
          python -c "from PIL import Image, ImageDraw, ImageFont; import qrcode; import win32print, win32ui; print('DEPENDENCIES OK')"

      - name: Build Windows EXE
        shell: cmd
        run: >
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name "Diamonds_Student_Point_Billing"
          --add-data "diamond_student_point_logo.png;."
          --collect-all PIL
          --collect-all qrcode
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageDraw
          --hidden-import PIL.ImageFont
          --hidden-import qrcode
          --hidden-import win32print
          --hidden-import win32ui
          "Diamonds_Student_Point_Quick_Billing.py"

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Diamonds_Student_Point_Billing.exe")) {
            throw "EXE was not created"
          }
          Get-Item "dist/Diamonds_Student_Point_Billing.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Diamonds-Student-Point-Billing-Windows
          path: dist/Diamonds_Student_Point_Billing.exe
